<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3));
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .header h1 { color: #fff; font-size: 2.2em; margin-bottom: 8px; }
        .header p { color: #b0b0c0; }
        
        .nav-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s;
            text-decoration: none;
            display: block;
        }
        .nav-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.15);
        }
        .nav-card h2 { color: #fff; font-size: 1.3em; margin-bottom: 8px; }
        .nav-card p { color: #a0a8c0; font-size: 0.9em; }
        
        .filters {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filters input, .filters select {
            background: rgba(40,40,80,0.9);
            border: 1px solid rgba(102,126,234,0.5);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card:hover { background: rgba(255,255,255,0.12); }
        .card-id {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 26px; height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
        }
        .card h3 { color: #fff; font-size: 0.95em; line-height: 1.4; margin-bottom: 10px; }
        .card .meta { font-size: 0.8em; color: #a0a0b0; margin-bottom: 8px; }
        .card .meta span { margin-right: 12px; }
        .card .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            margin-right: 8px;
        }
        .tag-sim { background: rgba(34,197,94,0.3); color: #86efac; }
        
        .card a {
            display: block;
            text-align: center;
            padding: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .stats { text-align: center; color: #888; margin-top: 20px; padding: 15px; }
        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
            .filters { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 论文工具</h1>
            <p>检索与精读</p>
        </div>
        
        <div class="nav-cards">
            <a href="search_results.html" class="nav-card">
                <h2>🔍 论文检索</h2>
                <p>查看论文检索结果</p>
            </a>
            <a href="deep_reading.html" class="nav-card">
                <h2>📖 精读报告</h2>
                <p>查看深度分析报告</p>
            </a>
        </div>
        
        <div class="filters">
            <input type="text" id="searchInput" placeholder="搜索标题..." oninput="filterPapers()" style="flex:2;min-width:180px;">
            <select id="yearFilter" onchange="filterPapers()">
                <option value="all">全部年份</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>
            <select id="simFilter" onchange="filterPapers()">
                <option value="all">全部相似度</option>
                <option value="100">100%</option>
                <option value="90">90%+</option>
                <option value="80">80%+</option>
            </select>
        </div>
        
        <div class="cards" id="cardsContainer"></div>
        <div class="stats" id="stats"></div>
    </div>
    
    <script>
        var papers = [{"id":1,"title":"1. EnvBench: A Benchmark for Automated Environment Setup","similarity":100.0,"year":2025},{"id":2,"title":"2. Multi-Docker-Eval: A 'Shovel of the Gold Rush' Benchmark on Automatic Environment Building for Software Engineering","similarity":100.0,"year":2025},{"id":3,"title":"3. SetupBench: Assessing Software Engineering Agents' Ability to Bootstrap Development Environments","similarity":100.0,"year":2025},{"id":4,"title":"4. Process-Level Trajectory Evaluation for Environment Configuration in Software Engineering Agents","similarity":100.0,"year":2025},{"id":5,"title":"5. MEnvAgent: Scalable Polyglot Environment Construction for Verifiable Software Engineering","similarity":98.0,"year":2026},{"id":6,"title":"6. CVE-Bench: Benchmarking LLM-based Software Engineering Agent's Ability to Repair Real-World CVE Vulnerabilities","similarity":97.0,"year":2025},{"id":7,"title":"7. HerAgent: Rethinking the Automated Environment Deployment via Hierarchical Test Pyramid","similarity":86.0,"year":2026},{"id":8,"title":"8. GitTaskBench: A Benchmark for Code Agents Solving Real-World Tasks Through Code Repository Leveraging","similarity":86.0,"year":2025},{"id":9,"title":"9. Spider2-V: How Far Are Multimodal Agents From Automating Data Science and Engineering Workflows?","similarity":84.0,"year":2024},{"id":10,"title":"10. IDE-Bench: Evaluating Large Language Models as IDE Agents on Real-World Software Engineering Tasks","similarity":83.0,"year":2026},{"id":11,"title":"11. LoCoBench-Agent: An Interactive Benchmark for LLM Agents in Long-Context Software Engineering","similarity":81.0,"year":2025},{"id":12,"title":"12. SWE-Dev: Building Software Engineering Agents with Training and Inference Scaling","similarity":81.0,"year":2025},{"id":13,"title":"13. SWE-Bench++: A Framework for the Scalable Generation of Software Engineering Benchmarks from Open-Source Repositories","similarity":78.0,"year":2025},{"id":14,"title":"14. Multi-Agent Systems for Dataset Adaptation in Software Engineering: Capabilities, Limitations, and Future Directions","similarity":78.0,"year":2025},{"id":15,"title":"15. SWE-MERA: A Dynamic Benchmark for Agenticly Evaluating Large Language Models on Software Engineering Tasks","similarity":77.0,"year":2025},{"id":16,"title":"16. Hadoop-Benchmark: Rapid Prototyping and Evaluation of Self-Adaptive Behaviors in Hadoop Clusters","similarity":75.0,"year":2017},{"id":17,"title":"17. Automated Benchmark Generation for Repository-Level Coding Tasks","similarity":73.0,"year":2025},{"id":18,"title":"18. Saving SWE-Bench: A Benchmark Mutation Approach for Realistic Agent Evaluation","similarity":72.0,"year":2025},{"id":19,"title":"19. PIPer: On-Device Environment Setup via Online Reinforcement Learning","similarity":70.0,"year":2025},{"id":20,"title":"20. Skywork-SWE: Unveiling Data Scaling Laws for Software Engineering in LLMs","similarity":70.0,"year":2025},{"id":21,"title":"21. Benchmarking Large Language Models for Root Cause Analysis in Train Control Software Testing","similarity":70.0,"year":2025},{"id":22,"title":"22. SWE-smith: Scaling Data for Software Engineering Agents","similarity":69.0,"year":2025},{"id":23,"title":"23. SWE-bench-java: A GitHub Issue Resolving Benchmark for Java","similarity":68.0,"year":2024},{"id":24,"title":"24. SWE-Master: Unleashing the Potential of Software Engineering Agents via Post-Training","similarity":67.0,"year":2026},{"id":25,"title":"25. TOM-SWE: User Mental Modeling For Software Engineering Agents","similarity":65.0,"year":2025},{"id":26,"title":"26. SWE-Sharp-Bench: A Reproducible Benchmark for C# Software Engineering Tasks","similarity":64.0,"year":2025},{"id":27,"title":"27. SyncMind: Measuring Agent Out-of-Sync Recovery in Collaborative Software Engineering","similarity":63.0,"year":2025},{"id":28,"title":"28. The Atlas Benchmark: an Automated Evaluation Framework for Human Motion Prediction","similarity":61.0,"year":2022},{"id":29,"title":"29. Automated Composition of Agents: A Knapsack Approach for Agentic Component Selection","similarity":61.0,"year":2025},{"id":30,"title":"30. SWE-QA: Can Language Models Answer Repository-level Code Questions?","similarity":61.0,"year":2025},{"id":31,"title":"31. CIPerf: a benchmark for continuous integration services performance and cost analysis","similarity":60.0,"year":2024},{"id":32,"title":"32. SWE-bench Goes Live!","similarity":60.0,"year":2025}];
        
        function filterPapers() {
            var search = document.getElementById('searchInput').value.toLowerCase();
            var year = document.getElementById('yearFilter').value;
            var sim = document.getElementById('simFilter').value;
            
            var filtered = papers.filter(function(p) {
                var matchSearch = p.title.toLowerCase().indexOf(search) !== -1;
                var matchYear = year === 'all' || p.year.toString() === year;
                var matchSim = sim === 'all' || p.similarity >= parseInt(sim);
                return matchSearch && matchYear && matchSim;
            });
            
            filtered.sort(function(a, b) { return b.similarity - a.similarity; });
            
            var container = document.getElementById('cardsContainer');
            if (filtered.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888;">暂无匹配</div>';
            } else {
                container.innerHTML = filtered.map(function(p) {
                    return '<div class="card">' +
                        '<span class="card-id">' + p.id + '</span>' +
                        '<h3>' + p.title + '</h3>' +
                        '<div class="meta">' +
                            '<span>📅 ' + p.year + '</span>' +
                            '<span>📊 ' + p.similarity + '%</span>' +
                        '</div>' +
                        '<a href="deep_reading.html#paper-' + p.id + '">查看精读报告</a>' +
                    '</div>';
                }).join('');
            }
            document.getElementById('stats').textContent = '共 ' + filtered.length + ' / ' + papers.length + ' 篇';
        }
        
        filterPapers();
    </script>
</body>
</html>
